<script>
  (function () {
    'use strict';

    const toc = document.getElementById('toc');
    const overlay = document.getElementById('toc-overlay');
    const toggle = document.getElementById('toc-toggle');

    if (!toc || !overlay || !toggle) {
      return;
    }

    function openToc() {
      toc.classList.add('open');
      overlay.classList.add('open');
      toggle.setAttribute('aria-expanded', 'true');
    }

    function closeToc() {
      toc.classList.remove('open');
      overlay.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
    }

    toggle.addEventListener('click', function () {
      if (toc.classList.contains('open')) {
        closeToc();
        return;
      }

      openToc();
    });

    overlay.addEventListener('click', closeToc);

    const links = document.querySelectorAll('#toc #TableOfContents a');
    if (!links.length) {
      return;
    }

    const headings = Array.from(
      document.querySelectorAll('#content h1, #content h2, #content h3, #content h4')
    );

    let paused = false;
    let pauseTimer;

    links.forEach(function (link) {
      link.addEventListener('click', function () {
        closeToc();
        paused = true;
        links.forEach(function (anchor) {
          anchor.classList.remove('active');
        });
        link.classList.add('active');
        clearTimeout(pauseTimer);
        pauseTimer = setTimeout(function () {
          paused = false;
        }, 600);
      });
    });

    function activate() {
      if (paused) {
        return;
      }

      const siteHeader = document.getElementById('site-header');
      if (!siteHeader) {
        return;
      }

      const threshold = siteHeader.offsetHeight + 16;
      let current = null;
      for (const heading of headings) {
        if (threshold >= heading.getBoundingClientRect().top) {
          current = heading;
        }
      }

      links.forEach(function (anchor) {
        anchor.classList.remove('active');
      });

      if (!current || !current.id) {
        return;
      }

      const match = document.querySelector('#toc a[href="#' + current.id + '"]');
      if (!match) {
        return;
      }

      match.classList.add('active');
    }

    window.addEventListener('scroll', activate, { passive: true, });
    activate();
  })();
</script>

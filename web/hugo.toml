baseURL = 'https://specdd.ai/'
ignoreFiles = ['\.draft\.', '\.note\.']
disableKinds = ['taxonomy', 'term']
languageCode = 'en-us'
enableGitInfo = true
title = 'SpecDD – Specification-Driven Development framework'

[params]
shortTitle = 'SpecDD'
description = 'SpecDD is a Specification-Driven Development framework that enables humans and AI agents to build better software'
socialImage = '/social.png'
socialImageWidth = 1200
socialImageHeight = 630
socialImageAlt = 'SpecDD - Specification-Driven Development framework'

[params.schema]
name = 'SpecDD'
url = 'https://specdd.ai/'
logo = '/logo.png'
image = '/social.png'
author = 'Matīss Treinis'
author_id = 'matiss-treinis'
same_as = [
  'https://github.com/specdd/specdd',
  'https://github.com/specdd/cli',
]
code_repository = 'https://github.com/specdd/specdd'
application_category = 'DeveloperApplication'
operating_system = 'Cross-platform'
license = 'https://www.apache.org/licenses/LICENSE-2.0'

[params.pageDescriptions]
'/quickstart/' = 'A short SpecDD quickstart for installing the CLI, initializing a project, adding local specs, and guiding agents with SpecDD.'
'/how-to/' = 'Practical SpecDD how-to guides for setup, writing local specs, agent workflows, and specification-driven development patterns.'
'/changelog/' = 'SpecDD release notes, framework updates, and changes to the specification-driven development workflow.'
'/language-reference/' = 'SpecDD language reference for the .sdd file format, syntax, sections, task markers, comments, and parsing rules.'

[frontmatter]
lastmod = [':git', 'lastmod', 'modified', 'date', 'publishDate']

[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = false

[markup.highlight]
style = 'github'

[pagination]
pagerSize = 10

[mediaTypes.'text/x-cloudflare-redirects']
suffixes = ['']

[outputFormats.REDIRECTS]
mediaType = 'text/x-cloudflare-redirects'
baseName = '_redirects'
isPlainText = true
notAlternative = true

[outputs]
home = ['HTML', 'RSS', 'REDIRECTS']

[module]
[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "../README.md"
target = "content/_index.md"

[[module.mounts]]
source = "../QUICKSTART.md"
target = "content/quickstart.md"

[[module.mounts]]
source = "../TOOLS.md"
target = "content/tools.md"

[[module.mounts]]
source = "../CHANGELOG.md"
target = "content/changelog.md"

[[module.mounts]]
source = "../LANGUAGE.md"
target = "content/language-reference.md"

[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "node_modules/@fontsource-variable/inter/files/inter-latin-ext-wght-normal.woff2"
target = "static/fonts/inter/inter-latin-ext-wght-normal.woff2"

[[module.mounts]]
source = "node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
target = "static/fonts/inter/inter-latin-wght-normal.woff2"

[[module.mounts]]
source = "node_modules/@fontsource-variable/inter/files/inter-latin-ext-wght-italic.woff2"
target = "static/fonts/inter/inter-latin-ext-wght-italic.woff2"

[[module.mounts]]
source = "node_modules/@fontsource-variable/inter/files/inter-latin-wght-italic.woff2"
target = "static/fonts/inter/inter-latin-wght-italic.woff2"

[[module.mounts]]
source = "../README.md"
target = "static/reference/README.md"

[[module.mounts]]
source = "../CHANGELOG.md"
target = "static/reference/CHANGELOG.md"

[[module.mounts]]
source = "../src"
target = "static/reference/src"
